name: Intraday snapshot update

on:
  schedule:
    - cron: "*/10 * * * 1-5" # 평일 10분마다
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Collect intraday snapshot
        run: python scripts/collect_intraday.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/intraday.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: intraday snapshot update"
          # daily-update.yml과 동시에 돌 수 있어 push 충돌 가능성이 있으므로 rebase 후 재시도
          git pull --rebase origin master
          git push
