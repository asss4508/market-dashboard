name: Daily market data update

on:
  schedule:
    - cron: "17 7 * * *" # KST 16:17
    - cron: "23 10 * * *" # KST 19:23
    - cron: "41 22 * * *" # KST 07:41
    - cron: "13 0 * * 1-5" # KST 09:13
  workflow_dispatch:
    inputs:
      backfill:
        description: "Refresh available history from 2016"
        type: boolean
        default: false
      diagnose_krx:
        description: "Run one safe KRX login diagnostic"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: market-data-writer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install -r scripts/requirements.txt
      - name: Test collectors and analytical formulas
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          python -m unittest discover -s tests -p 'test_*.py'
          if [ -f tests/analytics.test.mjs ]; then node --test tests/*.test.mjs; fi
      - name: Collect official market data
        id: market
        continue-on-error: true
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          BACKFILL: ${{ inputs.backfill || 'false' }}
        run: |
          if [ "$BACKFILL" = "true" ]; then
            python scripts/collect.py --backfill
          else
            python scripts/collect.py
          fi
      - name: Collect verified ETF portfolios
        id: etf
        continue-on-error: true
        run: python scripts/collect_etf.py
      - name: Refresh availability status
        run: python scripts/collect_intraday.py
      - name: Diagnose KRX login without printing credentials
        if: github.event_name == 'workflow_dispatch' && inputs.diagnose_krx
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/check_krx_connection.py
      - name: Build research and validate public artifacts
        run: |
          if [ -f scripts/analyze.mjs ]; then node scripts/analyze.mjs; fi
          python scripts/verify_data.py
      - name: Commit verified observations
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh verified market data and ETF portfolios"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-public-data
          path: data/
          retention-days: 7
      - name: Collection report
        if: always()
        env:
          MARKET_OUTCOME: ${{ steps.market.outcome }}
          ETF_OUTCOME: ${{ steps.etf.outcome }}
        run: |
          python scripts/verify_data.py --markdown >> "$GITHUB_STEP_SUMMARY"
          if [ "$MARKET_OUTCOME" != "success" ] || [ "$ETF_OUTCOME" != "success" ]; then
            echo "Some sources failed; dated observations are preserved. Inspect public diagnostics."
            exit 1
          fi
