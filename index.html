<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="코스피와 코스닥의 수급, 유동성, 시장확산도, 밸류에이션, 선물·옵션 및 ETF 보유비중 변화를 한눈에 확인하세요.">
  <meta name="color-scheme" content="light dark">
  <title>국내 증시 · 매크로 대시보드</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="vendor/chart.umd.min.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 이동</a>
  <header class="app-header">
    <div class="shell masthead">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></div>
        <h1>국내 증시 <span>· 매크로</span></h1>
      </div>
      <div class="header-actions">
        <span class="publication" id="last-updated" role="status">데이터 불러오는 중</span>
        <button class="header-button" type="button" id="data-status">데이터 상태</button>
        <button class="header-button theme-button" type="button" id="theme-toggle" aria-label="다크 모드로 전환">
          <span id="theme-icon" aria-hidden="true">☾</span><span id="theme-label">다크 모드</span>
        </button>
      </div>
    </div>
    <nav class="primary-nav" aria-label="대시보드 메뉴">
      <div class="shell navigation" id="navigation" role="tablist" aria-label="분석 메뉴"></div>
    </nav>
  </header>
  <main class="shell main" id="main">
    <section class="market-tiles" id="market-tiles" aria-label="주요 시장 지표"></section>
    <div id="load-warning" class="notice warning" hidden></div>
    <div class="page-heading">
      <div>
        <h2 id="page-title">전체 개요</h2>
        <p id="page-description"></p>
      </div>
      <div id="view-modes" class="view-modes">
        <div class="segmented" id="scale-mode" role="group" aria-label="차트 표시 단위">
          <button type="button" data-scale="raw" aria-pressed="true">원래 단위</button>
          <button type="button" data-scale="indexed" aria-pressed="false">기준 100</button>
        </div>
        <button class="button" type="button" id="config-open">가중치 설정</button>
      </div>
    </div>
    <div class="view-toolbar" id="time-toolbar">
      <div class="range-controls">
        <span class="toolbar-label">조회 기간</span>
        <div class="segmented date-presets" id="range-buttons" role="group" aria-label="조회 기간"></div>
      </div>
      <div class="range-controls">
        <span class="period-label" id="period-label"></span>
        <button type="button" id="range-edit" class="button" aria-expanded="false" aria-controls="date-form">날짜 선택</button>
      </div>
      <form id="date-form" class="date-form" hidden>
        <label>시작일 <input type="date" name="from" required></label>
        <label>종료일 <input type="date" name="to" required></label>
        <button type="submit" class="button primary">적용</button>
        <span id="date-error" class="field-error" role="status"></span>
      </form>
    </div>
    <section id="view" class="dashboard-grid" role="tabpanel" tabindex="0" aria-labelledby="tab-overview" aria-busy="true">
      <div class="empty-state span-12">시장 데이터를 불러오는 중입니다.</div>
    </section>
    <noscript><p class="notice warning">이 대시보드에서는 JavaScript로 차트와 ETF 공시를 표시합니다.</p></noscript>
  </main>
  <footer class="shell footer">
    <span>국내 증시 · 매크로 대시보드</span>
    <button type="button" class="text-button" id="method-open">산식과 데이터 출처</button>
  </footer>
  <dialog id="drawer" class="dialog">
    <div class="dialog-head">
      <h2 id="dialog-title"></h2>
      <form method="dialog"><button class="button close-button" aria-label="닫기">닫기</button></form>
    </div>
    <div id="dialog-body" class="dialog-body"></div>
  </dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
