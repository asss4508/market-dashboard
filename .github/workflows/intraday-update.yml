name: Intraday snapshot update
# A refreshed timestamp is not a real-time quote.
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: market-data-writer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/collect_intraday.py
      - name: Commit availability status
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/intraday-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh quote availability status"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
